<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="appPLC">
  <meta name="description" content="MELSEC Q · LS XGK PLC 래더 편집기와 현장 설비 시뮬레이터 — 스마트폰 · 태블릿에서 바로 실행">
  <title>appPLC — PLC 래더 시뮬레이터</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 위: 파일 · 설정 (아이콘) -->
    <header class="top">
      <span class="brand" title="appPLC">🔌</span>
      <button class="vendor" id="vendorBtn" title="제조사 (PLC 기종) 바꾸기"></button>
      <input id="edTitle" class="title" type="text" value="새 프로그램" title="프로젝트 이름" aria-label="프로젝트 이름">
      <button class="ibtn" data-act="new" title="새 프로그램">📄</button>
      <button class="ibtn" data-act="samples" title="예제 (강좌 실습 포함)">📚</button>
      <button class="ibtn" data-act="save" title="브라우저에 저장">💾</button>
      <button class="ibtn" data-act="open" title="불러오기 · 파일 열기">📂</button>
      <button class="ibtn wide-only" data-act="export" title="내보내기 (파일 · 리스트 · CSV)">⬇</button>
      <button class="ibtn wide-only" data-act="share" title="공유 링크 복사">🔗</button>
      <button class="ibtn wide-only" data-act="help" title="도움말">❓</button>
      <button class="ibtn wide-only" data-act="theme" title="라이트 / 다크">◐</button>
      <button class="ibtn narrow-only" data-act="more" title="더 보기 (내보내기 · 공유 · 도움말 · 테마)">⋯</button>
    </header>

    <!-- 화면 탭 (아이콘) -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="ladder" title="래더"><span>🪜</span><small>래더</small></button>
      <button class="tab" data-tab="list" title="명령어 리스트"><span>📝</span><small>리스트</small></button>
      <button class="tab" data-tab="io" title="현장 설비"><span>🔌</span><small>설비</small></button>
      <button class="tab" data-tab="rack" title="모듈 구성"><span>🗄</span><small>모듈</small></button>
      <button class="tab" data-tab="test" title="검사식"><span>✔</span><small>검사</small></button>
      <button class="tab" data-tab="monitor" title="PLC 모니터"><span>🔍</span><small>모니터</small></button>
      <span class="spacer"></span>
      <span class="msg" id="edMsg"></span>
    </nav>

    <!-- 가운데: 편집 화면 -->
    <main class="main">
      <section class="pane" data-pane="ladder">
        <div class="tools" id="ldTools">
          <button class="ibtn" data-tool="edit" title="편집 모드 켜기/끄기">✎</button>
          <button class="ibtn" data-tool="convert" title="변환 — 고친 회로를 프로그램에 반영하고 실행">✔<span class="k" data-k="convert"></span></button>
          <span class="mode" data-f="ldmode">모니터</span>
          <span class="sep"></span>
          <button class="ibtn" data-tool="undo" title="되돌리기 (Ctrl+Z)">↶</button>
          <button class="ibtn" data-tool="redo" title="다시 실행 (Ctrl+Y)">↷</button>
          <span class="sep"></span>
          <button class="ibtn" data-tool="NO" title="a 접점"><span class="t">┤├</span><span class="k" data-k="NO"></span></button>
          <button class="ibtn" data-tool="NC" title="b 접점"><span class="t">┤/├</span><span class="k" data-k="NC"></span></button>
          <button class="ibtn" data-tool="OR" title="a 접점 병렬 (위 행과 세로선으로 잇기)"><span class="t">┤├↓</span><span class="k" data-k="OR"></span></button>
          <button class="ibtn" data-tool="ORNC" title="b 접점 병렬"><span class="t">┤/├↓</span><span class="k" data-k="ORNC"></span></button>
          <button class="ibtn" data-tool="P" title="상승 펄스 접점"><span class="t">┤↑├</span><span class="k" data-k="P"></span></button>
          <button class="ibtn" data-tool="F" title="하강 펄스 접점"><span class="t">┤↓├</span><span class="k" data-k="F"></span></button>
          <button class="ibtn" data-tool="coil" title="코일 (OUT · SET · RST · 타이머 · 카운터)"><span class="t">( )</span><span class="k" data-k="coil"></span></button>
          <button class="ibtn" data-tool="app" title="응용 명령 (MOV · 연산 …)"><span class="t">[ ]</span><span class="k" data-k="app"></span></button>
          <button class="ibtn" data-tool="H" title="가로선"><span class="t">—</span><span class="k" data-k="H"></span></button>
          <button class="ibtn" data-tool="V" title="세로선 (아래 행과 잇기)"><span class="t">│</span><span class="k" data-k="V"></span></button>
          <span class="sep"></span>
          <button class="ibtn" data-tool="edit-cell" title="고른 칸 고치기 (Enter · 같은 칸 다시 탭)">✏</button>
          <button class="ibtn" data-tool="del" title="지우기 (Del)">🗑</button>
          <button class="ibtn" data-tool="insRow" title="행 삽입 (Insert)"><span class="t">+≡</span></button>
          <button class="ibtn" data-tool="delRow" title="행 삭제 (Ctrl+Del)"><span class="t">−≡</span></button>
          <span class="sep"></span>
          <button class="ibtn" data-tool="copy" title="복사 (Ctrl+C)">⧉</button>
          <button class="ibtn" data-tool="cut" title="잘라내기 (Ctrl+X)">✂</button>
          <button class="ibtn" data-tool="paste" title="붙여넣기 (Ctrl+V)">📌</button>
        </div>
        <div class="ladder-host">
          <div id="edLadder"></div>
          <div class="zoombar">
            <button class="ibtn" data-tool="zoomOut" title="축소">－</button>
            <span class="z" id="zoomVal">100%</span>
            <button class="ibtn" data-tool="zoomIn" title="확대 (손가락 두 개로 벌리기 · Ctrl+휠)">＋</button>
            <button class="ibtn" data-tool="zoomFit" title="화면 폭에 맞춤">⤢</button>
          </div>
        </div>
      </section>

      <section class="pane hidden" data-pane="list">
        <div class="bar"><button class="btn small primary" data-tool="applyList">↵ 프로그램에 반영</button>
          <span class="k">명령어 리스트를 직접 고칠 수 있습니다. ; 설명문 · @디바이스 코멘트</span></div>
        <textarea id="edList" class="ed-text" spellcheck="false" autocapitalize="characters" autocomplete="off"></textarea>
      </section>
      <section class="pane hidden" data-pane="io">
        <div class="bar"><button class="btn small primary" data-tool="applyIo">↵ 설비 적용</button>
          <button class="btn small ghost" data-tool="ioHelp">장비 목록</button>
          <span class="k" id="ioHint"></span></div>
        <textarea id="edIo" class="ed-text" spellcheck="false" autocapitalize="characters" autocomplete="off"></textarea>
      </section>
      <section class="pane hidden" data-pane="rack">
        <div class="bar"><button class="btn small primary" data-tool="applyRack">↵ 구성 적용</button>
          <button class="btn small ghost" data-tool="rackText">📝 텍스트</button>
          <span class="k" id="rackHint"></span></div>
        <div class="ed-rack"><div id="edRackForm" class="rack-form"></div><textarea id="edRack" class="ed-text hidden" spellcheck="false" autocapitalize="characters"></textarea></div>
      </section>
      <section class="pane hidden" data-pane="test">
        <div class="bar"><button class="btn small primary" data-tool="runTest">▶ 검사 실행</button>
          <span class="k">예: START=1 -&gt; Y20=1 · wait 2 -&gt; T0=1 · reset</span></div>
        <textarea id="edTest" class="ed-text" spellcheck="false" autocapitalize="characters"></textarea>
        <div id="edTestOut" class="ed-testout hidden"></div>
      </section>
      <section class="pane hidden" data-pane="monitor"><div id="monitorHost" style="flex:1;min-height:0"></div></section>
    </main>

    <!-- 상태 띠: RUN/STOP · 스캔 -->
    <div class="status" id="status">
      <button class="run off" data-act="run" title="RUN / STOP"><span class="led g" data-led="run"><i></i></span><span data-f="runtext">STOP</span></button>
      <button class="ibtn" data-act="reset" title="CPU 리셋 (모든 디바이스 초기화)">⟲</button>
      <button class="ibtn" data-act="step" title="1 스캔만 실행">⏭</button>
      <select data-act="speed" title="시뮬레이션 속도">
        <option value="0.1">×0.1</option><option value="0.25">×0.25</option><option value="0.5">×0.5</option>
        <option value="1" selected>×1</option><option value="2">×2</option><option value="5">×5</option>
      </select>
      <span class="led r" data-led="err"><i></i>ERR</span>
      <span class="err" data-f="err"></span>
      <span class="spacer"></span>
      <span class="scan" data-f="scan"></span>
      <button class="ibtn" data-act="plant" title="현장 설비 보이기/숨기기">🔌</button>
    </div>

    <!-- 아래: 현장 설비 (버튼 · 램프 · 실린더 …) -->
    <div class="plant" id="plantPane">
      <div class="grip" id="plantGrip" title="끌어서 높이 조절"></div>
      <div class="plant-wrap" id="plantWrap"><div id="edPlant"></div></div>
    </div>

    <!-- 넓은 화면: 오른쪽 모니터 -->
    <aside class="side" id="side"></aside>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><span id="modalTitle"></span><span class="spacer"></span><button id="modalClose" class="ibtn" aria-label="닫기">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="edFile" accept=".txt,.plc,.csv" class="hidden">

  <script>
    // 제조사(기종) 선택: ?v=melsec | xgk  → 기억해 두고 그 엔진만 불러온다
    (function () {
      var q = new URLSearchParams(location.search).get('v');
      var v = q || (function () { try { return localStorage.getItem('plcapp.vendor'); } catch (e) { return null; } })() || 'melsec';
      if (v !== 'melsec' && v !== 'xgk') v = 'melsec';
      try { localStorage.setItem('plcapp.vendor', v); } catch (e) { /* 무시 */ }
      window.APP_VENDOR = v;
      document.documentElement.dataset.vendor = v;
      try { var th = localStorage.getItem('plcapp.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* 무시 */ }
      var files = ['core', 'modules', 'plant', 'ladder', 'sim', 'plantview', 'monitor', 'bridge', 'samples', 'examples', 'vendor'].map(function (f) { return 'js/' + v + '/' + f + '.js'; })
        .concat(['js/ladderview.js', 'js/app.js']);
      files.forEach(function (src) { var s = document.createElement('script'); s.src = src; s.async = false; document.head.appendChild(s); });
    })();
  </script>
</body>
</html>
